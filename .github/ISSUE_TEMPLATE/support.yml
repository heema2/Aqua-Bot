name: Support request
description: Redirects to Discord — use the support server for help.
title: "[Support] "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        ## Please use the support server

        This repository is an **information hub only** — we do not track support tickets here.

        **Join [Aqua's Support Server](https://discord.gg/kKaSX5QJwa)** for:
        - Setup help
        - Bug reports
        - Feature requests

        You can also reach us through the contact options on [aqua-bot.xyz](https://www.aqua-bot.xyz).
  - type: checkboxes
    id: acknowledge
    attributes:
      label: Before continuing
      options:
        - label: I understand that support is handled on Discord and I will join the support server for help
          required: true
